<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JeenaFlix Player</title>

<script src="https://www.youtube.com/iframe_api"></script>

<style>
body{
  margin:0;
  background:#000;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

.player-container{
  position:relative;
  width:100vw;
  height:100vh;
  background:#000;
  overflow:hidden;
}

.video-wrap{
  position:absolute;
  top:-18%;
  left:-8%;
  width:116%;
  height:136%;
  z-index:1;
  pointer-events:none;
}

#player{
  width:100%;
  height:100%;
}

#player iframe{
  pointer-events:none !important;
}

.brand{
  position:absolute;
  top:18px;
  left:18px;
  z-index:9999;
  background:#e50914;
  color:#fff;
  padding:8px 14px;
  border-radius:8px;
  font-weight:900;
}

.center-play{
  position:absolute;
  inset:0;
  z-index:9998;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.18);
  cursor:pointer;
}

.center-play.hide{
  opacity:0;
  pointer-events:none;
}

.big-play{
  width:82px;
  height:82px;
  border-radius:50%;
  background:#e50914;
  display:flex;
  justify-content:center;
  align-items:center;
}

.big-play svg{
  width:44px;
  height:44px;
  fill:white;
  margin-left:5px;
}

.player-controls{
  position:absolute;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  z-index:99999;
  display:flex;
  align-items:center;
  gap:12px;
  background:rgba(0,0,0,.78);
  padding:12px 16px;
  border-radius:18px;
}

.ctrl-btn{
  width:46px;
  height:46px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,.18);
  color:white;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.ctrl-btn:hover{
  background:#e50914;
}

.ctrl-btn svg{
  width:24px;
  height:24px;
  fill:white;
}

.play-main{
  background:#e50914;
}

.end-cover{
  position:absolute;
  inset:0;
  z-index:999999;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:#fff;
}

.end-cover.show{
  display:flex;
}

.end-cover h2{
  margin:0 0 18px;
  font-size:26px;
}

.replay-btn{
  background:#e50914;
  color:white;
  border:none;
  padding:12px 24px;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

@media(max-width:600px){
  .player-controls{
    bottom:18px;
    gap:8px;
    padding:10px;
  }

  .ctrl-btn{
    width:42px;
    height:42px;
  }

  .brand{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="container" class="player-container">

  <div class="video-wrap">
    <div id="player"></div>
  </div>

  <div class="brand">JeenaFlix</div>

  <div id="centerPlay" class="center-play" onclick="togglePlayPause()">
    <div class="big-play">
      <svg viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"></path>
      </svg>
    </div>
  </div>

  <div class="player-controls">
    <button class="ctrl-btn" onclick="rewindVideo()" title="Back 10s">
      <svg viewBox="0 0 24 24">
        <path d="M11 18V6l-8.5 6L11 18zm.5-6l8.5 6V6l-8.5 6z"></path>
      </svg>
    </button>

    <button id="playPauseBtn" class="ctrl-btn play-main" onclick="togglePlayPause()" title="Play/Pause">
      <svg id="playIcon" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"></path>
      </svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;">
        <path d="M6 5h4v14H6zm8 0h4v14h-4z"></path>
      </svg>
    </button>

    <button class="ctrl-btn" onclick="forwardVideo()" title="Forward 10s">
      <svg viewBox="0 0 24 24">
        <path d="M13 6v12l8.5-6L13 6zM4 6v12l8.5-6L4 6z"></path>
      </svg>
    </button>

    <button class="ctrl-btn" onclick="goFullscreen()" title="Fullscreen">
      <svg viewBox="0 0 24 24">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"></path>
      </svg>
    </button>
  </div>

  <div id="endCover" class="end-cover">
    <h2>Video Ended</h2>
    <button class="replay-btn" onclick="replayVideo()">Replay</button>
  </div>

</div>

<script>
let player;
let endCheckTimer;

const centerPlay = document.getElementById("centerPlay");
const playIcon = document.getElementById("playIcon");
const pauseIcon = document.getElementById("pauseIcon");
const endCover = document.getElementById("endCover");

function onYouTubeIframeAPIReady(){
  player = new YT.Player("player", {
    videoId: "-Pkdo6_tEzg",
    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      fs: 0,
      rel: 0,
      modestbranding: 1,
      iv_load_policy: 3,
      playsinline: 1
    },
    events: {
      onStateChange: onPlayerStateChange
    }
  });
}

function togglePlayPause(){
  if(!player) return;

  endCover.classList.remove("show");

  if(player.getPlayerState() === YT.PlayerState.PLAYING){
    player.pauseVideo();
  } else {
    player.playVideo();
  }
}

function rewindVideo(){
  if(!player) return;
  endCover.classList.remove("show");

  const current = player.getCurrentTime();
  player.seekTo(Math.max(current - 10, 0), true);
}

function forwardVideo(){
  if(!player) return;

  const current = player.getCurrentTime();
  const duration = player.getDuration();

  if(duration && current + 10 >= duration - 1){
    stopAtEnd();
  } else {
    player.seekTo(current + 10, true);
  }
}

function stopAtEnd(){
  player.pauseVideo();
  centerPlay.classList.add("hide");
  playIcon.style.display = "block";
  pauseIcon.style.display = "none";
  endCover.classList.add("show");
}

function replayVideo(){
  endCover.classList.remove("show");
  player.seekTo(0, true);
  player.playVideo();
}

function onPlayerStateChange(event){
  if(event.data === YT.PlayerState.PLAYING){
    centerPlay.classList.add("hide");
    playIcon.style.display = "none";
    pauseIcon.style.display = "block";

    clearInterval(endCheckTimer);
    endCheckTimer = setInterval(function(){
      const current = player.getCurrentTime();
      const duration = player.getDuration();

      if(duration && current >= duration - 0.8){
        clearInterval(endCheckTimer);
        stopAtEnd();
      }
    }, 300);
  } else {
    clearInterval(endCheckTimer);

    if(event.data === YT.PlayerState.PAUSED){
      if(!endCover.classList.contains("show")){
        centerPlay.classList.remove("hide");
      }
      playIcon.style.display = "block";
      pauseIcon.style.display = "none";
    }

    if(event.data === YT.PlayerState.ENDED){
      stopAtEnd();
    }
  }
}

function goFullscreen(){
  const elem = document.getElementById("container");

  if(elem.requestFullscreen){
    elem.requestFullscreen();
  } else if(elem.webkitRequestFullscreen){
    elem.webkitRequestFullscreen();
  } else if(elem.msRequestFullscreen){
    elem.msRequestFullscreen();
  }
}
</script>

</body>
</html>
